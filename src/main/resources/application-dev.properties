# SERVICE CONFIGURATION & PORT DEFINITION
server.port=8082
spring.application.name=employee-core-service

# DOCKER MYSQL DIRECT MATRIX ROUTING (Port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/employee_core_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin_secure_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA HIBERNATE SCHEMA POLICIES
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# TELEMETRY EXPORT CAPABILITY (Actuator + Prometheus Scraper)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always